[package]
name = "air-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "air"
crate-type = ["cdylib", "rlib"]

[dependencies]
air-core = { path = "../../core" }
jni-sys = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", default-features = false, features = ["audio", "api-level-29"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
