<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Air Instruments</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
        font: 16px/1.4 system-ui, sans-serif; touch-action: none; }
      video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      video { object-fit: cover; transform: scaleX(-1); opacity: 0.55; }
      #start { position: absolute; inset: 0; margin: auto; width: 260px; height: 96px; z-index: 3;
        font-size: 22px; border-radius: 48px; border: 2px solid #8ff; background: #022; color: #fff; }
      #controls { position: absolute; top: 10px; right: 12px; left: 12px; z-index: 2; display: flex; gap: 10px;
        flex-wrap: wrap; justify-content: flex-end; pointer-events: none; }
      #controls button, #controls select { pointer-events: auto; min-width: 80px; min-height: 52px; padding: 0 16px; font-size: 18px;
        color: #fff; background: rgba(0, 40, 40, 0.55); border: 1px solid rgba(140, 255, 255, 0.6); border-radius: 26px; }
      #status { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: 10px; z-index: 2; opacity: 0.8; font-size: 14px; }
      /* While starting (and on errors): big and in the middle, so it can't be missed. */
      #status.starting { left: 0; right: 0; bottom: auto; top: 50%; transform: translateY(-50%);
        text-align: center; font-size: 22px; opacity: 1; padding: 0 24px; }
    </style>
  </head>
  <body>
    <video playsinline muted></video>
    <canvas id="scene"></canvas>
    <button id="start">Tap to start</button>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
