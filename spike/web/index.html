<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Latency spike (prototype)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 14px/1.35 monospace; overflow: hidden; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    #hud { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.6); padding: 8px; white-space: pre; z-index: 2; }
    #start { position: absolute; inset: 0; margin: auto; width: 240px; height: 80px; font-size: 20px; z-index: 3; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
  <video playsinline muted></video>
  <canvas></canvas>
  <div id="flash"></div>
  <div id="hud">PROTOTYPE latency spike. Tap Start.</div>
  <button id="start">Start</button>
  <script type="module" src="/main.ts"></script>
</body>
</html>
